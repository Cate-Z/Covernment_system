<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>政务数字门户平台</title>
    <style>
        :root {
            --primary: #1a3c6d; --primary-light: #2b5ea7; --accent: #d43030;
            --bg: #f0f2f5; --card: #fff; --text: #2c3e50; --text-secondary: #7f8c8d;
            --border: #e8ecf1; --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --shadow-hover: 0 8px 30px rgba(0,0,0,0.10); --radius: 12px;
            --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
            --topbar-bg: #fff; --table-stripe: #f8fafc;
        }
        [data-theme="dark"] {
            --bg: #1a1d23; --card: #242730; --text: #e4e6eb; --text-secondary: #9ca3af;
            --primary: #60a5fa; --primary-light: #93bbfd;
            --border: #333840; --shadow: 0 2px 12px rgba(0,0,0,0.3);
            --shadow-hover: 0 8px 30px rgba(0,0,0,0.4);
            --topbar-bg: #242730; --table-stripe: #2a2d37;
            --input-bg: #2a2d37; --input-bg-focus: #303540; --input-border: #444a55;
            --modal-bg: #2a2d37; --hover-bg: #2a2d37;
            --badge-blue-bg: #1a2740; --badge-green-bg: #1a3020; --badge-red-bg: #302020; --badge-orange-bg: #302518; --badge-gray-bg: #2a2a2a;
            --stat-blue-bg: #1a2740; --stat-green-bg: #1a3020; --stat-orange-bg: #302518; --stat-purple-bg: #251a30; --stat-red-bg: #302020;
            --announce-bg: #2d2a18; --announce-border: #4a4520;
            --news-cat-bg: #1a2740; --news-cat-color: #60a5fa;
            --login-card-bg: rgba(36,39,48,0.97); --login-input-bg: #1e2130; --login-input-border: #3a3f4b;
            --detail-bg: #2a2d37; --reply-bg: #1a3020; --reply-border: #2a4a30;
        }
        [data-theme="dark"] .input,[data-theme="dark"] .select{background:var(--input-bg);border-color:var(--input-border);color:var(--text)}
        [data-theme="dark"] .input:focus,[data-theme="dark"] .select:focus{background:var(--input-bg-focus)}
        [data-theme="dark"] .modal{background:var(--modal-bg)}
        [data-theme="dark"] .modal-header{border-bottom-color:var(--border)}
        [data-theme="dark"] .modal-footer{border-top-color:var(--border)}
        [data-theme="dark"] .form-group input,[data-theme="dark"] .form-group textarea,[data-theme="dark"] .form-group select{background:var(--input-bg);border-color:var(--input-border);color:var(--text)}
        [data-theme="dark"] .form-group input:focus,[data-theme="dark"] .form-group textarea:focus,[data-theme="dark"] .form-group select:focus{background:var(--input-bg-focus)}
        [data-theme="dark"] .login-card{background:var(--login-card-bg)}
        [data-theme="dark"] .login-card .field input{background:var(--login-input-bg);border-color:var(--login-input-border);color:var(--text)}
        [data-theme="dark"] .login-card .field input:focus{background:var(--login-input-bg)}
        [data-theme="dark"] .btn-outline{background:var(--card);border-color:var(--input-border)}
        [data-theme="dark"] .btn-outline:hover{border-color:var(--primary-light);color:var(--primary-light)}
        [data-theme="dark"] .pager button{background:var(--card);border-color:var(--input-border);color:var(--text)}
        [data-theme="dark"] table tbody td{border-bottom-color:var(--border)}
        [data-theme="dark"] table tbody tr:hover{background:var(--hover-bg)}
        [data-theme="dark"] .service-card{background:var(--card)}
        [data-theme="dark"] .badge-blue{background:var(--badge-blue-bg)} [data-theme="dark"] .badge-green{background:var(--badge-green-bg)}
        [data-theme="dark"] .badge-red{background:var(--badge-red-bg)} [data-theme="dark"] .badge-orange{background:var(--badge-orange-bg)}
        [data-theme="dark"] .badge-gray{background:var(--badge-gray-bg)}
        [data-theme="dark"] .stat-icon-box.blue{background:var(--stat-blue-bg)} [data-theme="dark"] .stat-icon-box.green{background:var(--stat-green-bg)}
        [data-theme="dark"] .stat-icon-box.orange{background:var(--stat-orange-bg)} [data-theme="dark"] .stat-icon-box.purple{background:var(--stat-purple-bg)}
        [data-theme="dark"] .stat-icon-box.red{background:var(--stat-red-bg)}
        [data-theme="dark"] .announce-bar{background:var(--announce-bg);border-color:var(--announce-border)}
        [data-theme="dark"] .announce-bar .announce-text{color:#c4a84a}
        [data-theme="dark"] .news-item .news-cat{background:var(--news-cat-bg);color:var(--news-cat-color)}
        [data-theme="dark"] .svc-card-mini:hover{background:var(--hover-bg)}
        .qcard{border-radius:10px;border:1px solid var(--border);transition:all var(--transition);cursor:pointer;padding:14px 14px;display:flex;align-items:center;gap:14px;margin-bottom:10px}
        .qcard:hover{border-color:var(--primary-light);background:var(--hover-bg)}
        .qcard .svc-icon-sm{font-size:30px;flex-shrink:0}
        .qcard .svc-name-sm{font-size:14px;font-weight:600}
        .qcard .svc-desc-sm{font-size:12px;color:var(--text-secondary)}
        [data-theme="dark"] .modal-close{background:var(--input-bg);color:var(--text-secondary)}
        [data-theme="dark"] .modal-close:hover{background:#3a2020;color:#f87171}
        [data-theme="dark"] .pie-chart::after{background:var(--card)}
        [data-theme="dark"] .detail-row{border-bottom-color:var(--border)}
        [data-theme="dark"] .timeline::before{background:var(--border)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}

        /* ========== 登录页 ========== */
        .login-wrapper{display:flex;justify-content:center;align-items:center;min-height:100vh;background:linear-gradient(135deg,#0f1a30,#1a3c6d 40%,#1e4d8c 70%,#15325c);position:relative;overflow:hidden}
        .login-wrapper::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 50%,rgba(255,255,255,0.03),transparent 60%),radial-gradient(circle at 70% 20%,rgba(212,48,48,0.06),transparent 50%);animation:bgFloat 20s ease-in-out infinite}
        @keyframes bgFloat{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(2%,1%) rotate(1deg)}}
        .login-card{position:relative;z-index:1;background:rgba(255,255,255,0.97);backdrop-filter:blur(20px);border-radius:20px;padding:48px 40px;width:420px;box-shadow:0 30px 80px rgba(0,0,0,0.35);animation:slideUp 0.6s cubic-bezier(0.4,0,0.2,1)}
        @keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
        .login-card .emblem{text-align:center;margin-bottom:8px;font-size:56px}
        .login-card h2{text-align:center;font-size:22px;font-weight:700;color:var(--primary);margin-bottom:6px;letter-spacing:2px}
        .login-card .subtitle{text-align:center;font-size:13px;color:var(--text-secondary);margin-bottom:28px;letter-spacing:1px}
        .login-card .field{margin-bottom:20px;position:relative}
        .login-card .field .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;color:#b0b8c1;pointer-events:none}
        .login-card .field input{width:100%;padding:14px 14px 14px 44px;border:2px solid #e0e5eb;border-radius:10px;font-size:15px;color:var(--text);background:#f8fafc;outline:none;transition:all var(--transition)}
        .login-card .field input:focus{border-color:var(--primary-light);background:#fff;box-shadow:0 0 0 4px rgba(26,60,109,0.08)}
        .login-card .field input:focus+.icon,.login-card .field input:focus~.icon{color:var(--primary)}
        .login-card .btn-login{width:100%;padding:14px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;letter-spacing:2px;transition:all var(--transition);box-shadow:0 6px 20px rgba(26,60,109,0.3)}
        .login-card .btn-login:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(26,60,109,0.45)}
        .login-card .btn-login:active{transform:translateY(0)}
        .login-card .error{background:#fff5f5;color:var(--accent);text-align:center;padding:10px;border-radius:8px;margin-bottom:16px;font-size:13px;display:none;border:1px solid #fecaca}
        .login-card .error.show{display:block;animation:shake 0.4s ease}
        @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
        .login-card .remember-row{display:flex;align-items:center;gap:8px;margin-bottom:20px;font-size:13px;color:var(--text-secondary);cursor:pointer}
        .login-card .remember-row input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--primary)}

        /* ========== 管理员布局 ========== */
        .app-shell{display:none;min-height:100vh}
        .sidebar{position:fixed;top:0;left:0;bottom:0;width:240px;background:linear-gradient(180deg,#0f1f3d,#1a3c6d);z-index:100;overflow-y:auto;box-shadow:4px 0 20px rgba(0,0,0,0.15)}
        .sidebar .brand{padding:28px 24px 20px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.08)}
        .sidebar .brand .logo-icon{font-size:42px;display:block;margin-bottom:8px}
        .sidebar .brand .name{font-size:16px;font-weight:700;color:#fff;letter-spacing:2px}
        .sidebar .brand .name-sub{font-size:11px;color:rgba(255,255,255,0.5);letter-spacing:3px;margin-top:4px}
        .sidebar .nav-item{display:flex;align-items:center;gap:12px;padding:13px 24px;margin:2px 12px;border-radius:10px;color:rgba(255,255,255,0.7);font-size:14px;cursor:pointer;transition:all var(--transition);border:none;background:none;width:calc(100% - 24px);text-align:left;font-family:inherit}
        .sidebar .nav-item:hover{background:rgba(255,255,255,0.08);color:#fff}
        .sidebar .nav-item.active{background:rgba(255,255,255,0.15);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
        .sidebar .nav-divider{margin:12px 24px;border:none;border-top:1px solid rgba(255,255,255,0.08)}
        .sidebar .nav-section-title{padding:8px 24px;font-size:11px;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:2px}
        .main-area{margin-left:240px;min-height:100vh}

        /* ========== 用户布局（侧边栏与管理端一致） ========== */
        .main-area-wide{margin-left:0;min-height:100vh}
        .user-sidebar{position:fixed;top:0;left:0;bottom:0;width:240px;background:linear-gradient(180deg,#0f1f3d,#1a3c6d);z-index:100;overflow-y:auto;box-shadow:4px 0 20px rgba(0,0,0,0.15)}
        .user-sidebar .ubrand{padding:28px 24px 20px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.08)}
        .user-sidebar .ubrand .uavatar{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;margin:0 auto 10px}
        .user-sidebar .ubrand .uname{font-size:16px;font-weight:700;color:#fff;letter-spacing:2px}
        .user-sidebar .ubrand .urole{font-size:11px;color:rgba(255,255,255,0.5);margin-top:4px;letter-spacing:3px;text-transform:uppercase}
        .user-sidebar .unav-item{display:flex;align-items:center;gap:12px;padding:13px 24px;margin:2px 12px;border-radius:10px;color:rgba(255,255,255,0.7);font-size:14px;cursor:pointer;transition:all var(--transition);border:none;background:none;width:calc(100% - 24px);text-align:left;font-family:inherit}
        .user-sidebar .unav-item:hover{background:rgba(255,255,255,0.08);color:#fff}
        .user-sidebar .unav-item.active{background:rgba(255,255,255,0.15);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,0.2)}
        .user-sidebar .unav-divider{margin:12px 24px;border:none;border-top:1px solid rgba(255,255,255,0.08)}
        .user-sidebar .unav-section-title{padding:8px 24px;font-size:11px;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:2px}
        .user-main-area{margin-left:240px;min-height:100vh}

        .topbar{background:var(--topbar-bg);padding:0 28px;height:60px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,0.04);position:sticky;top:0;z-index:50}
        .topbar .page-title{font-size:17px;font-weight:600;color:var(--text)}
        .topbar .user-info{display:flex;align-items:center;gap:12px}
        .topbar .user-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
        .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:140}

        .content-area{padding:28px;max-width:1200px;margin:0 auto}
        .content-area-wide{padding:28px}

        /* ========== 面包屑 & Footer ========== */
        .breadcrumb{padding:10px 28px;font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:6px;background:var(--topbar-bg);border-bottom:1px solid var(--border)}
        .breadcrumb span{cursor:pointer;transition:color var(--transition)}
        .breadcrumb span:hover{color:var(--primary-light)}
        .breadcrumb .bc-sep{color:var(--text-secondary);opacity:0.4;cursor:default}
        .app-footer{text-align:center;padding:16px 24px;font-size:11px;color:var(--text-secondary);border-top:1px solid var(--border);margin-top:40px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
        .copy-hint{font-size:10px;color:var(--primary-light);opacity:0;transition:opacity 0.3s}
        .copy-hint.show{opacity:1}

        /* ========== 统计卡片 ========== */
        .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:28px}
        .stat-card{background:var(--card);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;transition:all var(--transition);border:1px solid var(--border);position:relative;overflow:hidden;cursor:default}
        .stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
        .stat-card .stat-icon-box{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
        .stat-icon-box.blue{background:#eef4ff}.stat-icon-box.green{background:#e6f7ee}
        .stat-icon-box.orange{background:#fff7ed}.stat-icon-box.purple{background:#f3f0ff}.stat-icon-box.red{background:#fef2f2}
        .stat-card .stat-num{font-size:30px;font-weight:700;line-height:1.2}
        .stat-card .stat-label{font-size:13px;color:var(--text-secondary);margin-top:2px}

        /* ========== 面板 / 表格 / 按钮 ========== */
        .panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:24px;overflow:hidden}
        .panel-toolbar{padding:20px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border-bottom:1px solid var(--border);background:var(--card)}
        .panel-toolbar h2{font-size:17px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;margin:0}
        .toolbar-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
        .badge-count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:10px;background:#dc2626;color:#fff;font-size:11px;font-weight:700;padding:0 6px;line-height:1;transition:all 0.3s ease}.badge-count.warning{background:#ea580c;animation:pulse 1.5s infinite}.badge-count.danger{background:#991b1b;animation:pulse 0.8s infinite}@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(220,38,38,0.4)}50%{transform:scale(1.1);box-shadow:0 0 0 6px rgba(220,38,38,0)}}
        .timeline{position:relative;padding-left:28px}
        .timeline::before{content:'';position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--border)}
        .timeline-item{position:relative;padding:8px 0 16px}
        .timeline-item::before{content:'';position:absolute;left:-22px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--primary-light);border:2px solid var(--card);z-index:1}
        .timeline-item .tl-time{font-size:11px;color:var(--text-secondary);margin-bottom:2px}
        .timeline-item .tl-action{font-size:13px;font-weight:600;color:var(--text)}
        .timeline-item .tl-detail{font-size:12px;color:var(--text-secondary)}
        .refresh-btn,.theme-toggle,.logout-btn,.hamburger,.modal-close{width:34px;height:34px;border-radius:10px;border:none;background:transparent;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--transition)}
        .refresh-btn svg,.theme-toggle svg,.logout-btn svg,.hamburger svg,.modal-close svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform 0.5s cubic-bezier(0.4,0,0.2,1)}
        .refresh-btn:hover,.theme-toggle:hover{background:var(--bg);color:var(--primary-light)}
        .refresh-btn:hover svg{transform:rotate(270deg)}
        .refresh-btn:active svg{transform:rotate(450deg)}
        .theme-toggle .icon-sun{display:none}
        [data-theme="dark"] .theme-toggle .icon-moon{display:none}
        [data-theme="dark"] .theme-toggle .icon-sun{display:block}
        .theme-toggle:hover{background:var(--bg);color:#f59e0b}
        .theme-toggle:hover svg{transform:rotate(30deg)}
        .logout-btn{font-size:13px;font-family:inherit;padding:7px 14px;width:auto;gap:6px;border-radius:8px}
        .logout-btn:hover{background:#fee2e2;color:#dc2626}
        .logout-btn svg{width:18px;height:18px}
        .hamburger:hover{background:var(--bg);color:var(--text)}
        .modal-close:hover{background:#fee2e2;color:#dc2626}
        .modal-close:hover svg{transform:rotate(90deg)}
        .hamburger{display:none}
        .th-sort{cursor:pointer;user-select:none;position:relative;padding-right:18px!important}
        .th-sort::after{content:'↕';position:absolute;right:4px;opacity:0.3;font-size:11px}
        .th-sort.asc::after{content:'↑';opacity:1}
        .th-sort.desc::after{content:'↓';opacity:1}
        .btn{padding:9px 18px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all var(--transition);font-family:inherit;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
        .btn-blue{background:var(--primary);color:#fff}.btn-blue:hover{background:var(--primary-light);box-shadow:0 4px 12px rgba(26,60,109,0.3)}
        .btn-green{background:#16a34a;color:#fff}.btn-green:hover{background:#15803d}
        .btn-red{background:#dc2626;color:#fff}.btn-red:hover{background:#b91c1c}
        .btn-gray{background:#6b7280;color:#fff}.btn-gray:hover{background:#4b5563}
        .btn-outline{background:#fff;color:var(--text);border:1.5px solid #d1d5db}.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
        .btn-sm{padding:5px 12px;font-size:12px;border-radius:6px}
        .input,.select{padding:10px 14px;border:1.5px solid #d1d5db;border-radius:8px;font-size:13px;color:var(--text);background:#fff;transition:all var(--transition);font-family:inherit;outline:none}
        .input:focus,.select:focus{border-color:var(--primary-light);box-shadow:0 0 0 3px rgba(26,60,109,0.06)}
        .input{width:220px}
        .table-wrap{overflow-x:auto}
        table{width:100%;border-collapse:collapse}
        table thead th{padding:14px 16px;text-align:left;font-weight:600;font-size:13px;color:var(--text-secondary);background:var(--table-stripe);border-bottom:2px solid var(--border);white-space:nowrap}
        table tbody td{padding:13px 16px;font-size:13px;color:var(--text);border-bottom:1px solid #f1f5f9;vertical-align:middle}
        table tbody tr{transition:background 0.15s ease}table tbody tr:hover{background:#f8fafc}
        .badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
        .badge-blue{background:#eff6ff;color:#2563eb}.badge-green{background:#f0fdf4;color:#16a34a}
        .badge-red{background:#fef2f2;color:#dc2626}.badge-orange{background:#fff7ed;color:#ea580c}.badge-gray{background:#f3f4f6;color:#6b7280}
        .action-btns{display:flex;gap:6px}
        .pager{padding:18px 24px;display:flex;justify-content:center;align-items:center;gap:8px;border-top:1px solid var(--border)}
        .pager button{padding:7px 16px;border:1px solid #d1d5db;border-radius:6px;background:#fff;color:var(--text);font-size:13px;cursor:pointer;transition:all var(--transition);font-family:inherit}
        .pager button:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
        .pager button:disabled{opacity:0.4;cursor:not-allowed}
        .page-info{font-size:13px;color:var(--text-secondary);padding:0 8px}

        /* ========== 服务卡片 / 首页 / 图表 ========== */
        .services-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;padding:24px}
        .service-card{background:#fff;border-radius:var(--radius);padding:28px 24px;text-align:center;border:1px solid var(--border);cursor:pointer;transition:all var(--transition)}
        .service-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);border-color:var(--primary-light)}
        .service-card .svc-icon{font-size:44px;margin-bottom:14px}
        .service-card .svc-name{font-size:15px;font-weight:700;margin-bottom:8px}
        .service-card .svc-desc{font-size:13px;color:var(--text-secondary);line-height:1.5}

<script>
let currentPage=1,newsCurrentPage=1,feedbackCurrentPage=1,selectedUsers=new Set(),currentRole='',currentSection='',currentUserSection='';
let debounceTimers={};

function debounce(key, fn, delay=350){clearTimeout(debounceTimers[key]);debounceTimers[key]=setTimeout(fn,delay)}

function showToast(m,t='success'){const c=document.getElementById('toastContainer'),d=document.createElement('div'),i={success:'✅',error:'❌',warning:'⚠️'};d.className='toast '+t;d.innerHTML=i[t]+' '+m;c.appendChild(d);setTimeout(()=>{d.style.opacity='0';d.style.transform='translateX(60px)';d.style.transition='0.3s ease';setTimeout(()=>d.remove(),300)},3000)}
function closeModal(id=null){if(id){document.getElementById(id).classList.remove('show');return}document.getElementById('genericModal').classList.remove('show');document.getElementById('feedbackDetailModal').classList.remove('show')}

// ==================== 登录 ====================
async function doLogin(){
    const u=document.getElementById('loginUsername').value,p=document.getElementById('loginPassword').value;
    if(!u||!p){showToast('请输入用户名和密码','warning');return}
    try{
        const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
        const d=await r.json();
        if(d.success){
            currentRole=d.role;
            if(document.getElementById('rememberMe').checked){
                localStorage.setItem('gov_portal_remember',JSON.stringify({username:u,password:p,role:d.role}));
            }
            document.getElementById('loginPage').style.display='none';
            if(d.role==='admin'){
                document.getElementById('adminShell').style.display='block';document.getElementById('adminDisplayName').textContent='管理员';
                adminShow('home');
            }else{
                document.getElementById('userShell').style.display='block';document.getElementById('userDisplayName').textContent=d.name||u;
                document.getElementById('uSideName').textContent=d.name||u;document.getElementById('uSideAvatar').textContent=(d.name||u).charAt(0);
                loadUserPortal();
            }
            showToast(d.message||'登录成功','success');
        }else{
            const err=document.getElementById('loginError');err.classList.add('show');err.textContent=d.message||'用户名或密码错误';setTimeout(()=>err.classList.remove('show'),3000);
        }
    }catch(e){showToast('登录失败，请检查网络','error')}
}

async function doLogout(){
    try{await fetch('/api/logout',{method:'POST'})}catch(e){}
    localStorage.removeItem('gov_portal_remember');
    document.getElementById('adminShell').style.display='none';document.getElementById('userShell').style.display='none';
    document.getElementById('loginPage').style.display='flex';document.getElementById('loginUsername').value='';document.getElementById('loginPassword').value='';
    showToast('已退出登录','success');
}

// 自动登录检测
async function autoLogin(){
    // 1. 先检查 session
    try{
        const r=await fetch('/api/check_auth');const d=await r.json();
        if(d.authenticated){
            currentRole=d.role;document.getElementById('loginPage').style.display='none';
            if(d.role==='admin'){document.getElementById('adminShell').style.display='block';document.getElementById('adminDisplayName').textContent=d.name||'管理员';adminShow('home')}
            else{document.getElementById('userShell').style.display='block';document.getElementById('userDisplayName').textContent=d.name||d.username;document.getElementById('uSideName').textContent=d.name||d.username;document.getElementById('uSideAvatar').textContent=(d.name||d.username).charAt(0);loadUserPortal()}
            return;
        }
    }catch(e){}

    // 2. 再检查 localStorage 记住我
    const saved=localStorage.getItem('gov_portal_remember');
    if(saved){
        try{
            const cred=JSON.parse(saved);
            document.getElementById('loginUsername').value=cred.username;
            document.getElementById('loginPassword').value=cred.password;
            document.getElementById('rememberMe').checked=true;
            await doLogin();
            return;
        }catch(e){localStorage.removeItem('gov_portal_remember')}
    }

function renderBanner(containerId,news){
    const el=document.getElementById(containerId);
    if(!el||!news||news.length===0){if(el)el.style.display='none';return}
    const slides=news.slice(0,5).map((n,i)=>`<div class="banner-slide" style="background-image:url(${n.image_url});background-color:#1a3c6d" onclick="adminViewNews(${n.id})" title="点击查看详情"><div class="banner-info"><div class="banner-title">${n.title}</div><div class="banner-meta">${n.category} · ${n.publish_time?n.publish_time.split(' ')[0]:''}</div></div></div>`).join('');
    el.innerHTML=`<div class="banner-slides" id="${containerId}Slides">${slides}</div><button class="banner-prev" onclick="bannerSlide('${containerId}',-1)">‹</button><button class="banner-next" onclick="bannerSlide('${containerId}',1)">›</button><div class="banner-dots" id="${containerId}Dots">${news.slice(0,5).map((_,i)=>`<span class="${i===0?'active':''}" onclick="bannerGo('${containerId}',${i})"></span>`).join('')}</div>`;
    bannerIdx[containerId]=0;bannerLen[containerId]=news.slice(0,5).length;
    if(!bannerInterval[containerId])bannerInterval[containerId]=setInterval(()=>bannerSlide(containerId,1),5000);
}
let bannerIdx={},bannerLen={},bannerInterval={};
function bannerSlide(id,dir){
    const n=(bannerIdx[id]??0)+dir,max=bannerLen[id]||1;
    bannerIdx[id]=(n+max)%max;
    const slides=document.getElementById(id+'Slides');if(slides)slides.style.transform=`translateX(-${bannerIdx[id]*100}%)`;
    document.querySelectorAll(`#${id}Dots span`).forEach((s,i)=>s.classList.toggle('active',i===bannerIdx[id]));
}
function bannerGo(id,i){const cur=bannerIdx[id]||0;bannerSlide(id,i-cur)}

// ==================== 工具函数 ====================
function formatDateTime(dt){
    if(!dt)return '-';
    const d=new Date(dt.replace(/-/g,'/'));
    if(isNaN(d.getTime()))return dt;
    const pad=n=>n.toString().padStart(2,'0');
    const Y=d.getFullYear(),M=pad(d.getMonth()+1),D=pad(d.getDate());
    const h=pad(d.getHours()),m=pad(d.getMinutes()),s=pad(d.getSeconds());
    return `${Y}-${M}-${D} ${h}:${m}:${s}`;
}
function formatDate(dt){
    if(!dt)return '-';
    const d=new Date(dt.replace(/-/g,'/'));
    if(isNaN(d.getTime()))return dt.split(' ')[0]||dt;
    const pad=n=>n.toString().padStart(2,'0');
    const Y=d.getFullYear(),M=pad(d.getMonth()+1),D=pad(d.getDate());
    return `${Y}-${M}-${D}`;
}

    document.getElementById('adminContent').innerHTML=`<div class="panel"><div class="panel-toolbar"><h2>📢 通知公告</h2><button class="btn btn-blue" onclick="adminAddAnnouncement()">➕ 发布公告</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>标题</th><th>内容</th><th>置顶</th><th>发布时间</th><th>操作</th></tr></thead><tbody id="annTableBody"><tr><td colspan="6"><div class="loading-text">加载中...</div></td></tr></tbody></table></div></div>`;adminLoadAnnouncements();}
async function adminLoadAnnouncements(){try{const r=await fetch('/api/announcements'),d=await r.json();if(d.error)return;let h='';d.announcements.forEach(a=>{h+=`<tr><td style="font-weight:600">${a.id}</td><td style="font-weight:600;color:var(--primary)">${a.is_top?'📌 ':''}${a.title}</td><td style="max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a.content||''}</td><td><span class="badge ${a.is_top?'badge-orange':'badge-gray'}">${a.is_top?'置顶':'普通'}</span></td><td style="color:var(--text-secondary)">${a.created_at?a.created_at.split(' ')[0]:''}</td><td><div class="action-btns"><button class="btn btn-blue btn-sm" onclick="adminEditAnnouncement(${a.id})">编辑</button><button class="btn btn-red btn-sm" onclick="adminDelAnnouncement(${a.id})">删除</button></div></td></tr>`});document.getElementById('annTableBody').innerHTML=h||'<tr><td colspan="6"><div class="empty-text">暂无公告</div></td></tr>'}catch(e){showToast('加载失败','error')}}
function adminAddAnnouncement(){document.getElementById('modalTitle').textContent='📢 发布公告';document.getElementById('modalBody').innerHTML=`<input type="hidden" id="annId" value=""><div class="form-group"><label>标题</label><input type="text" id="annTitle"></div><div class="form-group"><label>内容</label><textarea id="annContent"></textarea></div><div class="form-group"><label><input type="checkbox" id="annIsTop" style="width:auto;margin-right:6px">置顶公告</label></div>`;document.getElementById('modalFooter').innerHTML='<button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-blue" onclick="adminSaveAnnouncement()">💾 发布</button>';document.getElementById('genericModal').classList.add('show')}
async function adminEditAnnouncement(id){try{const r=await fetch('/api/announcements'),d=await r.json();const a=d.announcements.find(x=>x.id===id);if(!a)return;document.getElementById('modalTitle').textContent='✏️ 编辑公告';document.getElementById('modalBody').innerHTML=`<input type="hidden" id="annId" value="${a.id}"><div class="form-group"><label>标题</label><input type="text" id="annTitle" value="${a.title||''}"></div><div class="form-group"><label>内容</label><textarea id="annContent">${a.content||''}</textarea></div><div class="form-group"><label><input type="checkbox" id="annIsTop" ${a.is_top?'checked':''} style="width:auto;margin-right:6px">置顶公告</label></div>`;document.getElementById('modalFooter').innerHTML='<button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-blue" onclick="adminSaveAnnouncement()">💾 更新</button>';document.getElementById('genericModal').classList.add('show')}catch(e){}}
async function adminSaveAnnouncement(){const id=document.getElementById('annId').value,title=document.getElementById('annTitle').value,content=document.getElementById('annContent').value,isTop=document.getElementById('annIsTop').checked?1:0;if(!title){showToast('请输入标题','warning');return}try{const url=id?`/api/announcements/${id}`:'/api/announcements',method=id?'PUT':'POST',r=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify({title,content,is_top:isTop})}),d=await r.json();if(d.success){showToast(id?'更新成功':'发布成功','success');closeModal();adminLoadAnnouncements()}else showToast(d.message||'操作失败','error')}catch(e){showToast('操作失败','error')}}
async function adminDelAnnouncement(id){if(!confirm('确定删除？'))return;try{await fetch(`/api/announcements/${id}`,{method:'DELETE'});showToast('删除成功','success');adminLoadAnnouncements()}catch(e){showToast('删除失败','error')}}

// ==================== 用户前台 ====================
let userCurrentPage=1,userMyFbPage=1;

function userShow(section){
    currentUserSection=section;
    const titles={home:'🏠 首页门户',blog:'📝 我的博客',friends:'👥 好友管理',feedback:'📋 我的反馈',profile:'👤 个人信息',password:'🔒 修改密码'};
    updateFooter();
    document.getElementById('userPageTitle').textContent=titles[section]||'';
    document.querySelectorAll('#userShell .unav-item').forEach(b=>b.classList.remove('active'));
    const nav=document.getElementById('unav'+section.charAt(0).toUpperCase()+section.slice(1));if(nav)nav.classList.add('active');
    if(section==='home')renderUserHome();
    if(section==='blog')renderUserBlogs();
    if(section==='friends')renderUserFriends();
    if(section==='feedback')renderUserFeedback();
    if(section==='profile')renderUserProfile();
    if(section==='password')renderUserChangePassword();
}

async function loadUserPortal(){
    try{const r=await fetch('/api/user/profile'),d=await r.json();if(d.success&&d.profile){document.getElementById('userDisplayName').textContent=d.profile.name||d.profile.username;document.getElementById('uSideName').textContent=d.profile.name||d.profile.username;document.getElementById('uSideAvatar').textContent=(d.profile.name||d.profile.username).charAt(0)}}catch(e){}
    userShow('home');
    // 异步加载公告
    fetch('/api/public/announcements').then(r=>r.json()).then(d=>{if(d.announcements&&d.announcements.length>0){const txt=d.announcements.map(a=>'📌 '+a.title+'：'+a.content).join(' ｜ ');const el=document.getElementById('announceText');if(el)el.textContent=txt}}).catch(()=>{});
}

const EMOJI_LIST=['😀','😂','🤣','😍','😎','😭','😡','👍','👎','❤️','🔥','⭐','🎉','💯','✨','🌟','💪','🙏','🤝','👏','🎊','🎈','🌹','🌸','💐','🍀','🎵','🎶','📢','💡','🔔','📌','✏️','📷','💻','🏠','🚀','💎','🌈','☀️','⚡'];

// ==================== 我的博客（用户） ====================
async function renderUserBlogs(){
    document.getElementById('userContent').innerHTML=`<div class="panel"><div class="panel-toolbar"><h2>📝 我的博客</h2><button class="btn btn-blue" onclick="showBlogEditor()">✍️ 写博客</button></div><div id="blogList"><div class="loading-text">加载中...</div></div><div class="pager" id="blogPager"></div></div>`;loadUserBlogList();}
async function loadUserBlogList(page=1){blogCurrentPage=page;try{const r=await fetch(`/api/my_blogs?page=${page}&per_page=8`),d=await r.json();if(d.error){showToast(d.error,'error');return}let h='';if(d.blogs&&d.blogs.length>0){d.blogs.forEach(b=>{h+=`<div class="blog-card" onclick="viewBlog(${b.id})"><div class="blog-card-hd"><span class="blog-card-title">${b.title}</span><span class="blog-card-badges"><span class="badge badge-blue">❤️ ${b.likes||0}</span><span class="badge badge-gray">💬 ${b.comment_count||0}</span><span class="badge badge-green">👁 ${b.views||0}</span></span></div><div class="blog-card-body">${b.content.replace(/<[^>]*>/g,'').substring(0,120)}${b.content.length>120?'...':''}</div><div class="blog-card-ft"><span>${b.created_at?b.created_at.split(' ')[0]:''}</span><button class="btn btn-red btn-sm" onclick="event.stopPropagation();delBlog(${b.id})">删除</button></div></div>`})}else h='<div class="empty-text">还没有博客，快去写一篇吧！</div>';document.getElementById('blogList').innerHTML=h;let ph='';if(d.total>8){let pp=Math.ceil(d.total/8);for(let i=1;i<=pp;i++)ph+=`<button onclick="loadUserBlogList(${i})" ${i===page?'disabled':''}>${i}</button>`;document.getElementById('blogPager').innerHTML=ph}}catch(e){showToast('加载失败','error')}}

function showBlogEditor(id){if(id){fetch(`/api/blogs/${id}`).then(r=>r.json()).then(d=>{if(d.blog)openBlogEditor(d.blog)})}else openBlogEditor(null)}
function openBlogEditor(blog){
    document.getElementById('modalTitle').textContent=blog?'✏️ 编辑博客':'✍️ 写博客';
    document.getElementById('modalBody').innerHTML=`<input type="hidden" id="blogEditId" value="${blog?blog.id:''}"><div class="form-group"><label>标题</label><input type="text" id="blogTitle" value="${blog?blog.title:''}" placeholder="请输入博客标题"></div><div class="form-group"><label>内容</label><textarea id="blogContent" placeholder="分享你的想法..." style="min-height:200px;font-size:14px;line-height:1.8">${blog?blog.content:''}</textarea><div class="emoji-bar" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;padding:8px;background:var(--detail-bg);border-radius:8px;max-height:140px;overflow-y:auto">${EMOJI_LIST.map(e=>`<span style="cursor:pointer;font-size:20px;padding:2px 4px;border-radius:4px;transition:background .2s" onmouseover="this.style.background='var(--primary-light)'" onmouseout="this.style.background='transparent'" onclick="insertEmoji('${e}')">${e}</span>`).join('')}</div></div><div class="form-group"><label>图片</label><input type="file" id="blogImageInput" accept="image/*" onchange="uploadBlogImage()" style="font-size:13px"><div id="blogImagePreview" style="margin-top:8px;display:flex;flex-wrap:wrap;gap:8px">${blog&&blog.images?blog.images.split(',').filter(u=>u).map(u=>`<div style="position:relative;display:inline-block"><img src="${u}" style="max-width:120px;max-height:120px;border-radius:6px;object-fit:cover"><button onclick="removeBlogImage(this,'${u}')" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#ef4444;color:#fff;border:none;cursor:pointer;font-size:12px;line-height:1">×</button></div>`).join(''):''}</div></div>`;
    document.getElementById('modalFooter').innerHTML='<button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-blue" onclick="saveBlog()">💾 发布</button>';
    document.getElementById('genericModal').classList.add('show');
    blogImages=[];
    if(blog&&blog.images)blogImages=blog.images.split(',').filter(u=>u);
}
let blogImages=[];
function insertEmoji(emoji){const ta=document.getElementById('blogContent');if(!ta)return;const s=ta.selectionStart;ta.value=ta.value.slice(0,s)+emoji+ta.value.slice(s);ta.selectionStart=ta.selectionEnd=s+emoji.length;ta.focus()}
function uploadBlogImage(){const f=document.getElementById('blogImageInput').files[0];if(!f)return;const r=new FileReader();r.onload=async e=>{try{const res=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:e.target.result})}),d=await res.json();if(d.success){blogImages.push(d.url);document.getElementById('blogImagePreview').insertAdjacentHTML('beforeend',`<div style="position:relative;display:inline-block"><img src="${d.url}" style="max-width:120px;max-height:120px;border-radius:6px;object-fit:cover"><button onclick="removeBlogImage(this,'${d.url}')" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#ef4444;color:#fff;border:none;cursor:pointer;font-size:12px;line-height:1">×</button></div>`)}else showToast('上传失败','error')}catch(e){showToast('上传失败','error')}};r.readAsDataURL(f)}
function removeBlogImage(btn,url){btn.parentElement.remove();blogImages=blogImages.filter(u=>u!==url)}
async function saveBlog(){const id=document.getElementById('blogEditId').value,title=document.getElementById('blogTitle').value.trim(),content=document.getElementById('blogContent').value.trim();if(!title||!content){showToast('标题和内容不能为空','warning');return}const body={title,content,images:blogImages.join(',')};try{let r;if(id){r=await fetch(`/api/blogs/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}else{r=await fetch('/api/blogs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}const d=await r.json();if(d.success){showToast(id?'更新成功':'发布成功','success');closeModal();loadUserBlogList(blogCurrentPage);if(currentUserSection==='home')loadBlogHome()}else showToast(d.message||'操作失败','error')}catch(e){showToast('操作失败','error')}}

async function viewBlog(id){blogCurrentId=id;try{const r=await fetch(`/api/blogs/${id}`),d=await r.json();if(d.error){showToast(d.error,'error');return}const b=d.blog,cs=d.comments;let imgHtml='';if(b.images)imgHtml=b.images.split(',').filter(u=>u).map(u=>`<img src="${u}" style="max-width:100%;border-radius:8px;margin:8px 0">`).join('');
document.getElementById('modalTitle').textContent=b.title;
let ch='';if(cs&&cs.length>0)cs.forEach(c=>{ch+=`<div style="padding:10px 0;border-bottom:1px solid var(--border)"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-weight:600;color:var(--primary);font-size:13px">${c.username}</span><span style="font-size:11px;color:var(--text-secondary)">${formatDateTime(c.created_at)}</span>${(document.getElementById('userDisplayName')?.textContent===c.username)||(currentRole==='admin')?`<button class="btn btn-red btn-sm" onclick="delBlogComment(${b.id},${c.id})">×</button>`:''}</div><div style="font-size:13px;line-height:1.7">${c.content}</div></div>`});
document.getElementById('modalBody').innerHTML=`<div style="max-height:60vh;overflow-y:auto"><div style="font-size:14px;line-height:1.9;margin-bottom:16px">${b.content}</div>${imgHtml}<div style="display:flex;gap:16px;align-items:center;margin:12px 0;padding:10px 0;border-top:1px solid var(--border);color:var(--text-secondary);font-size:12px"><span>✍️ ${b.username}</span><span>📅 ${formatDateTime(b.created_at)}</span><span>👁 ${b.views}</span><span style="cursor:pointer;color:#ef4444" onclick="toggleBlogLike(${b.id})">❤️ <span id="blogLikeCount">${b.likes||0}</span></span></div><div style="margin-top:16px"><div style="font-weight:600;margin-bottom:8px;font-size:14px">💬 评论 (${cs?cs.length:0})</div><div>${ch||'<div style="color:var(--text-secondary);font-size:13px;padding:12px 0">暂无评论</div>'}</div></div></div>`;
document.getElementById('modalFooter').innerHTML=`<div style="display:flex;gap:8px;width:100%"><input type="text" id="blogCommentInput" placeholder="写下你的评论..." style="flex:1" onkeydown="if(event.key==='Enter')addBlogComment(${b.id})"><button class="btn btn-blue btn-sm" onclick="addBlogComment(${b.id})">发送</button></div>`;
document.getElementById('genericModal').classList.add('show')}catch(e){showToast('加载失败','error')}}
async function addBlogComment(blogId){const input=document.getElementById('blogCommentInput');if(!input)return;const c=input.value.trim();if(!c){showToast('请输入评论内容','warning');return}try{const r=await fetch(`/api/blogs/${blogId}/comments`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:c})}),d=await r.json();if(d.success){showToast('评论成功','success');viewBlog(blogId)}else showToast(d.message||'评论失败','error')}catch(e){showToast('评论失败','error')}}
async function delBlogComment(blogId,commentId){if(!confirm('确定删除该评论？'))return;try{const r=await fetch(`/api/blogs/${blogId}/comments/${commentId}`,{method:'DELETE'}),d=await r.json();if(d.success){showToast('评论已删除','success');viewBlog(blogId)}else showToast(d.message||'删除失败','error')}catch(e){showToast('删除失败','error')}}
async function toggleBlogLike(blogId){try{const r=await fetch(`/api/blogs/${blogId}/like`,{method:'POST'}),d=await r.json();if(d.success){const el=document.getElementById('blogLikeCount');if(el)el.textContent=parseInt(el.textContent)+(d.liked?1:-1);showToast(d.message,'success')}}catch(e){}}
async function delBlog(id){if(!confirm('确定删除该博客？'))return;try{const r=await fetch(`/api/blogs/${id}`,{method:'DELETE'}),d=await r.json();if(d.success){showToast('删除成功','success');loadUserBlogList(blogCurrentPage)}else showToast(d.message||'删除失败','error')}catch(e){showToast('删除失败','error')}}
async function loadBlogHome(){try{const r=await fetch('/api/blogs?per_page=4'),d=await r.json();if(d.blogs){let h='';d.blogs.forEach(b=>{h+=`<div class="blog-card" onclick="viewBlog(${b.id})"><div class="blog-card-hd"><span class="blog-card-title">${b.title}</span><span class="blog-card-badges"><span class="badge badge-blue">❤️ ${b.likes||0}</span><span class="badge badge-gray">💬 ${b.comment_count||0}</span></span></div><div class="blog-card-body">${b.content.replace(/<[^>]*>/g,'').substring(0,100)}${b.content.length>100?'...':''}</div><div class="blog-card-ft"><span>✍️ ${b.username} · ${b.created_at?b.created_at.split(' ')[0]:''}</span></div></div>`});document.getElementById('uBlogHomeList').innerHTML=h||'<div class="empty-text">暂无博客</div>'}}catch(e){}}

// ==================== 我的反馈 ====================
async function renderUserFeedback(){
    document.getElementById('userContent').innerHTML=`
        <div class="panel"><div class="panel-toolbar"><h2>📋 我的反馈记录</h2><span style="font-size:13px;color:var(--text-secondary)">查看您提交的反馈及官方回复</span></div>
        <div class="table-wrap"><table><thead><tr><th>ID</th><th>类型</th><th>内容</th><th>状态</th><th>时间</th><th>官方回复</th></tr></thead><tbody id="myFbTableBody"><tr><td colspan="6"><div class="loading-text">加载中...</div></td></tr></tbody></table></div>
        <div class="pager" id="myFbPagination"><button onclick="userLoadMyFeedback(userMyFbPage-1)" disabled>上一页</button><span class="page-info">第1页/共1页</span><button onclick="userLoadMyFeedback(userMyFbPage+1)" disabled>下一页</button></div></div>`;
    userLoadMyFeedback();
}
async function userLoadMyFeedback(page=1){
    try{const r=await fetch(`/api/user/my_feedback?page=${page}&per_page=10`),d=await r.json();if(!d.success)return;userMyFbPage=page;let h='';d.feedback.forEach(x=>{h+=`<tr><td style="font-weight:600">${x.id}</td><td><span class="badge badge-orange">${x.type}</span></td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${x.content}</td><td><span class="badge ${x.status==='pending'?'badge-red':'badge-green'}">${x.status==='pending'?'待处理':'已处理'}</span></td><td style="color:var(--text-secondary)">${x.create_time?x.create_time.split(' ')[0]:''}</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-secondary)">${x.reply||'-'}</td></tr>`});document.getElementById('myFbTableBody').innerHTML=h||'<tr><td colspan="6"><div class="empty-text">暂无反馈记录</div></td></tr>';const p=document.getElementById('myFbPagination'),bs=p.querySelectorAll('button');bs[0].disabled=userMyFbPage<=1;bs[1].disabled=userMyFbPage>=d.total_pages;p.querySelector('.page-info').textContent=`第${userMyFbPage}页/共${d.total_pages||1}页`}catch(e){showToast('加载失败','error')}}

// ==================== 个人信息 ====================
async function renderUserProfile(){
    document.getElementById('userContent').innerHTML=`<div class="loading-text">加载中...</div>`;
    try{
        const [profileRes, blogsRes]=await Promise.all([fetch('/api/user/profile'), fetch('/api/my_blogs?per_page=5')]);
        const profile=await profileRes.json();
        const blogs=await blogsRes.json();
        if(!profile.success){document.getElementById('userContent').innerHTML='<div class="empty-text">加载失败</div>';return}
        const u=profile.profile;
        const deptOptions=await loadDeptOptions();
        
        // 计算统计数据
        const blogStats={total:blogs.total||0, likes:0, comments:0};
        (blogs.blogs||[]).forEach(b=>{blogStats.likes+=b.likes||0;blogStats.comments+=b.comment_count||0});
        
        // 构建博客列表
        let blogList='';
        if(blogs.blogs&&blogs.blogs.length>0){
            blogList=blogs.blogs.map(b=>`
                <div class="blog-card" onclick="viewBlog(${b.id})">
                    <div class="blog-card-hd">
                        <span class="blog-card-title">${b.title}</span>
                        <span class="blog-card-badges">
                            <span class="badge badge-blue">❤️ ${b.likes||0}</span>
                            <span class="badge badge-gray">💬 ${b.comment_count||0}</span>
                        </span>
                    </div>
                    <div class="blog-card-body">${b.content.replace(/<[^>]*>/g,'').substring(0,80)}${b.content.length>80?'...':''}</div>
                    <div class="blog-card-ft"><span>${formatDateTime(b.created_at)}</span></div>
                </div>
            `).join('');
        }else{
            blogList='<div class="empty-text" style="text-align:center;padding:20px">还没有发布博客</div>';
        }
        
        document.getElementById('userContent').innerHTML=`
            <div class="panel">
                <div style="display:flex;gap:24px;padding:24px;border-bottom:1px solid var(--border)">
                    <div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;flex-shrink:0">${(u.name||u.username).charAt(0)}</div>
                    <div style="flex:1">
                        <h2 style="margin:0;font-size:20px;color:var(--text)">${u.name||u.username}</h2>
                        <p style="margin:4px 0;color:var(--text-secondary);font-size:13px">@${u.username} ${u.department?'· '+u.department:''}</p>
                        <div style="display:flex;gap:20px;margin-top:12px">
                            <div><span style="font-weight:700;color:var(--primary)">${blogStats.total}</span><span style="color:var(--text-secondary);font-size:12px;margin-left:4px">文章</span></div>
                            <div><span style="font-weight:700;color:#ef4444">${blogStats.likes}</span><span style="color:var(--text-secondary);font-size:12px;margin-left:4px">获赞</span></div>
                            <div><span style="font-weight:700;color:#3b82f6">${blogStats.comments}</span><span style="color:var(--text-secondary);font-size:12px;margin-left:4px">评论</span></div>
                        </div>
                    </div>
                </div>
                
                <div style="padding:16px">
                    <div class="panel-toolbar" style="padding:0;margin-bottom:16px">
                        <h3 style="margin:0;font-size:15px">✏️ 我的文章</h3>
                        <button class="btn btn-blue btn-sm" onclick="showBlogEditor()">+ 写博客</button>
                    </div>
                    <div id="profileBlogList">${blogList}</div>
                </div>
            </div>
            
            <div class="panel" style="margin-top:12px">
                <div class="panel-toolbar"><h3>⚙️ 账户设置</h3></div>
                <div style="padding:24px;max-width:400px">
                    <div class="form-group"><label>用户名</label><input type="text" value="${u.username}" disabled style="background:var(--input-bg);color:var(--text-secondary)"></div>
                    <div class="form-group"><label>姓名</label><input type="text" id="profileName" value="${u.name||''}"></div>
                    <div class="form-group"><label>邮箱</label><input type="email" id="profileEmail" value="${u.email||''}"></div>
                    <div class="form-group"><label>电话</label><input type="text" id="profilePhone" value="${u.phone||''}"></div>
                    <div class="form-group"><label>部门</label><select id="profileDepartment"><option value="">请选择部门</option>${deptOptions}</select></div>
                    <div style="display:flex;gap:12px;margin-top:16px">
                        <div style="flex:1;padding:12px;background:var(--bg);border-radius:8px">
                            <div style="font-size:11px;color:var(--text-secondary)">最后登录</div>
                            <div style="font-size:12px;color:var(--text)">${formatDateTime(u.last_login_time)||'从未登录'}</div>
                        </div>
                        <div style="flex:1;padding:12px;background:var(--bg);border-radius:8px">
                            <div style="font-size:11px;color:var(--text-secondary)">注册时间</div>
                            <div style="font-size:12px;color:var(--text)">${formatDateTime(u.created_at)||'-'}</div>
                        </div>
                    </div>
                    <button class="btn btn-blue" onclick="userSaveProfile()" style="width:100%;margin-top:16px">💾 保存修改</button>
                </div>
            </div>
        `;
        document.getElementById('profileDepartment').value=u.department||'';
    }catch(e){console.error(e);document.getElementById('userContent').innerHTML='<div class="empty-text">加载失败</div>'}
}
async function userSaveProfile(){
    const name=document.getElementById('profileName').value,email=document.getElementById('profileEmail').value.trim(),phone=document.getElementById('profilePhone').value,department=document.getElementById('profileDepartment').value;
    if(!name){showToast('请输入姓名','warning');return}
    try{const r=await fetch('/api/user/profile',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,phone,department})}),d=await r.json();if(d.success){showToast('个人信息更新成功','success');document.getElementById('userDisplayName').textContent=name;document.getElementById('uSideName').textContent=name;document.getElementById('uSideAvatar').textContent=name.charAt(0);renderUserProfile()}else showToast(d.message||'更新失败','error')}catch(e){showToast('更新失败','error')}}

// ==================== 好友管理 ====================
async function renderUserFriends(){
    document.getElementById('userContent').innerHTML=`<div class="panel"><div class="panel-toolbar"><h2>👥 好友管理</h2></div><div style="padding:16px 24px;display:flex;gap:8px"><input class="input" type="text" id="friendSearchInput" placeholder="输入好友用户名搜索..." style="flex:1"><button class="btn btn-blue" onclick="searchAndAddFriend()">➕ 添加好友</button></div><div id="friendSearchResults" style="padding:0 24px"></div><div id="friendList" style="padding:0 24px 24px"><div class="loading-text">加载中...</div></div></div>`;loadFriends();}
async function loadFriends(){try{const r=await fetch('/api/friends'),d=await r.json();if(Array.isArray(d)){let h='';if(d.length===0)h='<div class="empty-text">还没有好友，快去添加吧！</div>';else d.forEach(f=>{h+=`<div style="display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px;border-radius:8px;background:var(--bg);border:1px solid var(--border)"><div style="width:40px;height:40px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0">${(f.name||f.username).charAt(0)}</div><div style="flex:1"><div style="font-weight:600;color:var(--primary);font-size:14px">${f.username}</div><div style="font-size:12px;color:var(--text-secondary)">${f.name||''} ${f.department?('· '+f.department):''}</div></div><button class="btn btn-red btn-sm" onclick="removeFriend(${f.id})">删除</button></div>`});document.getElementById('friendList').innerHTML=h}}catch(e){showToast('加载失败','error')}}
async function searchAndAddFriend(){const q=document.getElementById('friendSearchInput').value.trim();if(!q){showToast('请输入用户名','warning');return}try{const r=await fetch('/api/users/search?q='+encodeURIComponent(q)),d=await r.json();if(Array.isArray(d)&&d.length>0){let h='<div style="margin:12px 0;font-size:13px;color:var(--text-secondary)">搜索结果：</div>';d.forEach(u=>{h+='<div style="display:flex;align-items:center;justify-content:space-between;padding:10px;margin-bottom:4px;border-radius:8px;background:var(--bg)"><div style="font-weight:600;color:var(--primary);font-size:14px">'+u.username+'</div><div style="font-size:12px;color:var(--text-secondary)">'+(u.name||'')+' '+(u.department?'· '+u.department:'')+'</div><button class="btn btn-blue btn-sm" onclick="addFriend(\x27'+u.username+'\x27)">添加</button></div>'});document.getElementById('friendSearchResults').innerHTML=h}else{document.getElementById('friendSearchResults').innerHTML='<div style="margin:12px 0;font-size:13px;color:var(--text-secondary)">未找到用户</div>'}}catch(e){}}
async function addFriend(username){try{const r=await fetch('/api/friends/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username})}),d=await r.json();if(d.success){showToast('好友添加成功','success');document.getElementById('friendSearchResults').innerHTML='';document.getElementById('friendSearchInput').value='';loadFriends()}else showToast(d.message||'添加失败','error')}catch(e){showToast('添加失败','error')}}
async function removeFriend(friendId){if(!confirm('确定删除该好友？'))return;try{const r=await fetch(`/api/friends/${friendId}`,{method:'DELETE'}),d=await r.json();if(d.success){showToast('好友已删除','success');loadFriends()}else showToast(d.message||'删除失败','error')}catch(e){showToast('删除失败','error')}}

// ==================== 管理员博客管理 ====================
let adminBlogPage=1, adminBlogFilter='all';
async function renderAdminBlogs(){
    document.getElementById('adminContent').innerHTML=`<div class="panel"><div class="panel-toolbar"><h2>📝 博客管理</h2><div style="display:flex;gap:8px"><select id="blogStatusFilter" onchange="adminBlogFilter=this.value;loadAdminBlogs()" style="padding:6px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg)"><option value="all">全部</option><option value="pending">待审核</option><option value="published">已发布</option><option value="rejected">已拒绝</option></select><input type="text" id="blogSearchInput" placeholder="搜索标题或作者..." style="padding:6px 10px;border-radius:6px;border:1px solid var(--border);width:200px" onkeydown="if(event.key==='Enter')loadAdminBlogs()"><button class="btn btn-gray btn-sm" onclick="loadAdminBlogs()">搜索</button></div></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>标题</th><th>作者</th><th>状态</th><th>点赞</th><th>评论</th><th>浏览</th><th>时间</th><th>操作</th></tr></thead><tbody id="adminBlogTableBody"><tr><td colspan="9"><div class="loading-text">加载中...</div></td></tr></tbody></table></div><div class="pager" id="adminBlogPager"></div></div>`;loadAdminBlogs();}
async function loadAdminBlogs(page=1){adminBlogPage=page;try{const filter=document.getElementById('blogStatusFilter')?.value||adminBlogFilter;const search=document.getElementById('blogSearchInput')?.value||'';const url=new URL('/api/admin/blogs',window.location.origin);url.searchParams.set('page',page);url.searchParams.set('per_page',10);url.searchParams.set('status',filter);url.searchParams.set('q',search);const r=await fetch(url),d=await r.json();if(d.error)return;let h='';if(d.blogs&&d.blogs.length>0){d.blogs.forEach(b=>{const statusBadge=b.status==='pending'?'<span class="badge badge-yellow">待审核</span>':b.status==='published'?'<span class="badge badge-green">已发布</span>':'<span class="badge badge-red">已拒绝</span>';const actions=b.status==='pending'?`<button class="btn btn-green btn-sm" onclick="adminApproveBlog(${b.id})">通过</button><button class="btn btn-red btn-sm" onclick="adminRejectBlog(${b.id})">拒绝</button><button class="btn btn-blue btn-sm" onclick="viewBlog(${b.id})">查看</button>`:`<button class="btn btn-blue btn-sm" onclick="viewBlog(${b.id})">查看</button><button class="btn btn-red btn-sm" onclick="adminDelBlog(${b.id})">删除</button>`;h+=`<tr><td style="font-weight:600">${b.id}</td><td style="font-weight:600;color:var(--primary);cursor:pointer" onclick="viewBlog(${b.id})">${b.title}</td><td>${b.username}</td><td>${statusBadge}</td><td>❤️ ${b.likes||0}</td><td>💬 ${b.comment_count||0}</td><td>👁 ${b.views||0}</td><td style="color:var(--text-secondary);font-size:12px">${b.created_at?b.created_at.split(' ')[0]:''}</td><td><div class="action-btns">${actions}</div></td></tr>`})}else h='<tr><td colspan="9"><div class="empty-text">暂无博客</div></td></tr>';document.getElementById('adminBlogTableBody').innerHTML=h;let ph='';if(d.total_pages>1){for(let i=1;i<=d.total_pages;i++)ph+=`<button onclick="loadAdminBlogs(${i})" ${i===page?'disabled':''}>${i}</button>`;document.getElementById('adminBlogPager').innerHTML=ph}}catch(e){showToast('加载失败','error')}}
async function adminApproveBlog(id){try{const r=await fetch(`/api/admin/blogs/${id}/approve`,{method:'POST'}),d=await r.json();if(d.success){showToast('审核通过','success');loadAdminBlogs(adminBlogPage)}else showToast(d.message||'审核失败','error')}catch(e){showToast('审核失败','error')}}
async function adminRejectBlog(id){try{const r=await fetch(`/api/admin/blogs/${id}/reject`,{method:'POST'}),d=await r.json();if(d.success){showToast('已拒绝','success');loadAdminBlogs(adminBlogPage)}else showToast(d.message||'操作失败','error')}catch(e){showToast('操作失败','error')}}
async function adminDelBlog(id){if(!confirm('确定删除该博客？此操作不可恢复！'))return;try{const r=await fetch(`/api/blogs/${id}`,{method:'DELETE'}),d=await r.json();if(d.success){showToast('删除成功','success');loadAdminBlogs(adminBlogPage)}else showToast(d.message||'删除失败','error')}catch(e){showToast('删除失败','error')}}

// ==================== 修改密码 ====================
function renderUserChangePassword(){
    document.getElementById('userContent').innerHTML=`
        <div class="panel"><div class="panel-toolbar"><h2>🔒 修改密码</h2></div>
        <div style="padding:24px;max-width:420px">
            <div class="form-group"><label>原密码</label><input type="password" id="oldPassword" placeholder="请输入原密码"></div>
            <div class="form-group"><label>新密码</label><input type="password" id="newPassword" placeholder="至少6位"></div>
            <div class="form-group"><label>确认新密码</label><input type="password" id="confirmPassword" placeholder="再次输入新密码"></div>
            <button class="btn btn-blue" onclick="userDoChangePassword()" style="width:100%">🔒 修改密码</button>
        </div></div>`;
}
async function userDoChangePassword(){
    const oldPw=document.getElementById('oldPassword').value,newPw=document.getElementById('newPassword').value,confirmPw=document.getElementById('confirmPassword').value;
    if(!oldPw||!newPw){showToast('请填写完整','warning');return}
    if(newPw!==confirmPw){showToast('两次新密码不一致','warning');return}
    if(newPw.length<6){showToast('新密码至少6位','warning');return}
    try{const r=await fetch('/api/user/change_password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({old_password:oldPw,new_password:newPw})}),d=await r.json();if(d.success){showToast('密码修改成功','success');document.getElementById('oldPassword').value='';document.getElementById('newPassword').value='';document.getElementById('confirmPassword').value=''}else showToast(d.message||'修改失败','error')}catch(e){showToast('修改失败','error')}}
</script>
</body>
</html>
